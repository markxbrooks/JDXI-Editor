[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jdxi_manager"
version = "0.9.7"
description = "A MIDI manager and editor for the Roland JD-Xi synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mark Brooks", email = "mark.x.brooks@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
# What the application imports (checked by starting the main window with
# each module blocked); a frozen developer environment is not a dependency list
dependencies = [
    "PySide6>=6.8.1.1",
    "python-rtmidi>=1.5.8",
    "mido>=1.3",
    "qtawesome",
    "Pillow",
    "numpy",
    "music21",
    "PyAudio",
    "pyqtdarktheme",
    "darkdetect",
    "SQLAlchemy>=2.0",
    "decologr",
    "picomidi",
    "pyfluidsynth",
]

[project.optional-dependencies]
soundfont = ["sf2utils>=1.0.0", "sounddevice>=0.4.0"]
plots = ["matplotlib"]
dev = ["pytest>=8", "mypy", "black", "isort", "flake8"]

[project.urls]
Homepage = "https://github.com/markxbrooks/JDXI-Editor"
Repository = "https://github.com/markxbrooks/JDXI-Editor.git"
Issues = "https://github.com/markxbrooks/JDXI-Editor/issues"

[project.scripts]
jdxi_manager = "jdxi_editor.main:main"
jdxi-editor = "jdxi_editor.main:main"

[tool.hatch.build.targets.wheel]
# picoui is shipped from this repository until a release newer than 0.1.1
# (which lacks picoui.helpers, dialogs, menu, ...) is published.
# resources/ sits next to the package (see jdxi_editor/resources.py); it is
# shipped without image-editor sources and the README/demo animations.
only-include = ["jdxi_editor", "picoui", "resources"]
exclude = ["jdxi_editor/devel", "*.xcf", "*.rhif", "*.gif", "*.mp4", "*.mov", ".DS_Store"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m 'not slow and not hardware'"
testpaths = [
    "tests",
]
markers = [
    "slow: needs local files or plays in real time (run with -m slow)",
    "hardware: needs a connected JD-Xi (run with -m hardware)",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 
