[build-system]
# Pillow: hatch_build.py scales the resource images down for the packages
requires = ["hatchling", "Pillow"]
build-backend = "hatchling.build"

[project]
name = "JDXI-Editor"
dynamic = ["version"]  # from jdxi_editor/project.py (__version__), the one the app shows
description = "A MIDI manager and editor for the Roland JD-Xi synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mark Brooks", email = "mark.x.brooks@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
# What the application imports (checked by starting the main window with
# each module blocked); a frozen developer environment is not a dependency list
dependencies = [
    # <6.10: the main window crashes (segfault) on opening with PySide6 6.12,
    # in a queued slot receiving outgoing MIDI; the 6.9 series works. 6.10 and
    # 6.11 are untested: raise the cap once the window opens cleanly on them
    "PySide6>=6.8.1.1,<6.10",
    "python-rtmidi>=1.5.8",
    "mido>=1.3",
    "qtawesome",
    "Pillow",
    "numpy",
    "music21",
    "pyqtdarktheme",
    "darkdetect",
    "SQLAlchemy>=2.0",
    "decologr",
    # 0.3.0: the first release that ships picomidi.playback.scheduler and
    # PlaybackEngine.set_track_volume / set_track_transpose /
    # set_track_channel_map, which jdxi_editor/midi/playback/transport.py
    # imports and calls. 0.2.0 ships the subpackages (core, playback, sysex,
    # ...) but not those, so the main window will not import against it.
    "picomidi>=0.3.0",
    "pyfluidsynth",
    # Audio monitor and FluidSynth device selection. The PortAudio binaries
    # ship inside this package and have to be present when the app is frozen.
    "sounddevice>=0.4.0",
    # User skins are TOML files (ui/style/user_skins.py); tomllib is in the
    # standard library from Python 3.11
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
soundfont = ["sf2utils>=1.0.0", "sounddevice>=0.4.0"]
plots = ["matplotlib"]
# soundfile: tests/test_refine.py, test_audio_evidence.py and
# test_arpeggio_refine.py write a WAV to tmp_path and read it back. Its
# wheels bundle libsndfile for macOS, Linux and Windows, so no system
# package is needed. Undeclared, it was present only as a transitive
# dependency of a local librosa install, and CI failed at collection.
# librosa: the same tests reach scripts/midi_parts/evidence.py, which imports
# it (constant-Q evidence); undeclared, they failed on the runners with
# ModuleNotFoundError.
dev = ["pytest>=8", "mypy", "black", "isort", "flake8", "soundfile", "librosa"]

[project.urls]
Homepage = "https://github.com/markxbrooks/JDXI-Editor"
Repository = "https://github.com/markxbrooks/JDXI-Editor.git"
Issues = "https://github.com/markxbrooks/JDXI-Editor/issues"

[project.scripts]
jdxi_manager = "jdxi_editor.main:main"
jdxi-editor = "jdxi_editor.main:main"

[tool.hatch.version]
path = "jdxi_editor/project.py"

[tool.hatch.build.targets.wheel]
# picoui is shipped from this repository: the newest release on PyPI (0.1.3)
# still lacks picoui.helpers, specs.widgets, widget.helper, ... that the editor
# uses. resources/ is added by hatch_build.py, inside the package.
only-include = ["jdxi_editor", "picoui"]
exclude = ["jdxi_editor/devel", ".DS_Store"]

[tool.hatch.build.targets.sdist]
only-include = [
    "jdxi_editor",
    "picoui",
    "tests",
    "hatch_build.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = ["jdxi_editor/devel", ".DS_Store"]

# Adds resources/ (large PNGs scaled down) to both packages
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m 'not slow and not hardware'"
testpaths = [
    "tests",
]
markers = [
    "slow: needs local files or plays in real time (run with -m slow)",
    "hardware: needs a connected JD-Xi (run with -m hardware)",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 
