[build-system]
# Pillow: hatch_build.py scales the resource images down for the packages
requires = ["hatchling", "Pillow"]
build-backend = "hatchling.build"

[project]
name = "jdxi_manager"
dynamic = ["version"]  # from jdxi_editor/project.py (__version__), the one the app shows
description = "A MIDI manager and editor for the Roland JD-Xi synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mark Brooks", email = "mark.x.brooks@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
# What the application imports (checked by starting the main window with
# each module blocked); a frozen developer environment is not a dependency list
dependencies = [
    # <6.10: the main window crashes (segfault) on opening with PySide6 6.12,
    # in a queued slot receiving outgoing MIDI; the 6.9 series works. 6.10 and
    # 6.11 are untested: raise the cap once the window opens cleanly on them
    "PySide6>=6.8.1.1,<6.10",
    "python-rtmidi>=1.5.8",
    "mido>=1.3",
    "qtawesome",
    "Pillow",
    "numpy",
    "music21",
    "PyAudio",
    "pyqtdarktheme",
    "darkdetect",
    "SQLAlchemy>=2.0",
    "decologr",
    # 0.2.0: the first release that ships picomidi's subpackages (core,
    # playback, sysex, ...); 0.1.2 contains the top-level package only
    "picomidi>=0.2.0",
    "pyfluidsynth",
]

[project.optional-dependencies]
soundfont = ["sf2utils>=1.0.0", "sounddevice>=0.4.0"]
plots = ["matplotlib"]
dev = ["pytest>=8", "mypy", "black", "isort", "flake8"]

[project.urls]
Homepage = "https://github.com/markxbrooks/JDXI-Editor"
Repository = "https://github.com/markxbrooks/JDXI-Editor.git"
Issues = "https://github.com/markxbrooks/JDXI-Editor/issues"

[project.scripts]
jdxi_manager = "jdxi_editor.main:main"
jdxi-editor = "jdxi_editor.main:main"

[tool.hatch.version]
path = "jdxi_editor/project.py"

[tool.hatch.build.targets.wheel]
# picoui is shipped from this repository: the newest release on PyPI (0.1.3)
# still lacks picoui.helpers, specs.widgets, widget.helper, ... that the editor
# uses. resources/ is added by hatch_build.py, inside the package.
only-include = ["jdxi_editor", "picoui"]
exclude = ["jdxi_editor/devel", ".DS_Store"]

[tool.hatch.build.targets.sdist]
only-include = [
    "jdxi_editor",
    "picoui",
    "tests",
    "hatch_build.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = ["jdxi_editor/devel", ".DS_Store"]

# Adds resources/ (large PNGs scaled down) to both packages
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m 'not slow and not hardware'"
testpaths = [
    "tests",
]
markers = [
    "slow: needs local files or plays in real time (run with -m slow)",
    "hardware: needs a connected JD-Xi (run with -m hardware)",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 
