# Build the desktop packages and attach them to a release.
#
# Each package can only be built on its own platform: py2app makes the macOS
# disk image, PyInstaller the Windows executable, and PyInstaller with
# dpkg-deb the Linux .deb (and the AppImage, where appimagetool runs). So the
# builds run on the three runners rather than anywhere local -- a Mac cannot
# produce the Windows or the Linux package, and a .deb built on Apple silicon
# would be arm64 rather than the amd64 nearly every Linux user wants.
#
# A release published from a tag gets all three by itself. A tag that was
# released before this workflow existed can be filled in by hand:
# Actions > Release assets > Run workflow, with the tag's name.

name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to, e.g. v1.0.0"
        required: true

permissions:
  contents: write # uploading assets to the release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not withhold the others
      matrix:
        include:
          - os: macos-latest
            label: macOS disk image
            packages: |
              *.dmg
          - os: windows-latest
            label: Windows executable
            packages: |
              dist/*.exe
          - os: ubuntu-latest
            label: Linux .deb and AppImage
            packages: |
              dist/linux/*.deb
              dist/linux/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag being released, or the one asked for by hand
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ALSA for python-rtmidi, and the libraries Qt loads; dpkg-deb is
      # already on the runner
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller py2app

      # The vendored appimagetool needs the executable bit, and the runners
      # have no FUSE, so it has to unpack itself to run
      - name: Allow appimagetool to run (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x building/linux/appimagetool || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        run: python -m building.buildsys --dmg

      - name: Build the package
        if: runner.os != 'macOS'
        run: python -m building.buildsys

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          # A pattern that matches nothing must disappear rather than stand
          # as a literal filename, and the Windows executable is called
          # "JD-Xi Editor.exe": the glob is expanded into an array so the
          # space in that name does not split it in two.
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            files+=( $pattern )
          done <<< "${{ matrix.packages }}"

          # Nothing to upload is a failure worth seeing: a build step can
          # report success having quietly skipped a package
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package was built for ${{ matrix.label }}"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done
