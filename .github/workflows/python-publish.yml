# Publish jdxi_manager to PyPI when a GitHub release is published, or to
# TestPyPI when run by hand (Actions > Upload Python Package > Run workflow).
#
# Uploads use trusted publishing (no API token in the repository). Set it up
# once on each index, under the project's Publishing settings (for a first
# release: "Add a pending publisher"):
#   owner markxbrooks, repository JDXI-Editor,
#   workflow python-publish.yml, environment pypi (or testpypi)
# and create the GitHub environments "pypi" and "testpypi" (Settings >
# Environments), with required reviewers on "pypi" if wanted.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A release tagged v0.9.8 (or 0.9.8) must build version 0.9.8, which
      # comes from jdxi_editor/project.py (__version__)
      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('jdxi_editor/project.py').read())[1])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $GITHUB_REF_NAME, version $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jdxi_manager
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jdxi_manager
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
