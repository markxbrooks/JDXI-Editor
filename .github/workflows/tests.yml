name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    env:
      # Qt without a display; tests create real widgets
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PortAudio (PyAudio), ALSA (python-rtmidi), libraries Qt loads offscreen
          sudo apt-get install -y portaudio19-dev libasound2-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Default run: excludes tests marked slow (local files, real time) and
      # hardware (a connected JD-Xi); see [tool.pytest.ini_options]
      - name: Test
        run: python -m pytest
